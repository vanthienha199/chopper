<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chopper Live</title>
<style>
  :root {
    --bg:#f4f7fb; --card:#ffffff; --border:#e3e8ef; --text:#1e293b; --muted:#64748b;
    --gpu:#16a34a; --cpu:#2563eb; --grid:#eef2f7;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 40px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:2px; }
  h1 { font-size:24px; margin:0; letter-spacing:-0.02em; }
  .sub { color:var(--muted); font-size:14px; }
  .status { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:#cbd5e1; }
  .dot.live { background:var(--gpu); box-shadow:0 0 0 3px rgba(22,163,74,0.15); }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:0 1px 3px rgba(15,23,42,0.04); }
  .card .lab { font-size:13px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:8px; }
  .swatch { width:11px; height:11px; border-radius:3px; }
  .val { font-size:44px; font-weight:750; line-height:1.05; margin-top:6px; letter-spacing:-0.02em; }
  .val small { font-size:20px; font-weight:600; color:var(--muted); }
  .chartcard { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px 8px; box-shadow:0 1px 3px rgba(15,23,42,0.04); }
  .legend { display:flex; gap:18px; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .legend span { display:flex; align-items:center; gap:6px; }
  canvas { width:100%; height:340px; display:block; }
  .foot { color:var(--muted); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chopper Live</h1>
    <span class="sub">CPU and GPU on one timeline, streaming as the run goes</span>
    <span class="status"><span class="dot" id="dot"></span><span id="statustxt">connecting…</span></span>
  </header>

  <div class="cards">
    <div class="card">
      <div class="lab"><span class="swatch" style="background:var(--gpu)"></span>GPU busy</div>
      <div class="val" id="gpuval">--<small>%</small></div>
    </div>
    <div class="card">
      <div class="lab"><span class="swatch" style="background:var(--cpu)"></span>CPU busy (mean core)</div>
      <div class="val" id="cpuval">--<small>%</small></div>
    </div>
  </div>

  <div class="chartcard">
    <div class="legend">
      <span><span class="swatch" style="background:var(--gpu)"></span>GPU busy %</span>
      <span><span class="swatch" style="background:var(--cpu)"></span>CPU busy %</span>
      <span style="margin-left:auto" id="srclab"></span>
    </div>
    <canvas id="chart"></canvas>
  </div>
  <div class="foot" id="foot">Waiting for data…</div>
</div>

<script>
const MAXP = 260;
const data = [];               // {t, cpu, gpu}
const cv = document.getElementById('chart');
const ctx = cv.getContext('2d');
let dirty = false;

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function resize(){
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  dirty = true;
}
window.addEventListener('resize', resize);

function draw(){
  if(!dirty) return; dirty = false;
  const W = cv.clientWidth, H = cv.clientHeight;
  const padL=38, padR=12, padT=10, padB=22;
  ctx.clearRect(0,0,W,H);
  const x0=padL, x1=W-padR, y0=padT, y1=H-padB;
  // gridlines + y labels (0..100)
  ctx.strokeStyle=css('--grid'); ctx.fillStyle=css('--muted');
  ctx.lineWidth=1; ctx.font='11px -apple-system,Segoe UI,sans-serif'; ctx.textBaseline='middle';
  for(let v=0; v<=100; v+=25){
    const y = y1 - (v/100)*(y1-y0);
    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    ctx.fillText(v, 8, y);
  }
  if(data.length<2) return;
  const n = data.length;
  const line = (key,color) => {
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<n;i++){
      const x = x0 + (i/(MAXP-1))*(x1-x0);
      const y = y1 - (Math.min(100,Math.max(0,data[i][key]))/100)*(y1-y0);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  };
  line('gpu', css('--gpu'));
  line('cpu', css('--cpu'));
}
function loop(){ draw(); requestAnimationFrame(loop); }

function setStatus(live){
  document.getElementById('dot').className = 'dot' + (live?' live':'');
  document.getElementById('statustxt').textContent = live?'live':'disconnected';
}

const es = new EventSource('/events');
es.onopen = ()=> setStatus(true);
es.onerror = ()=> setStatus(false);
es.onmessage = (e)=>{
  let r; try{ r = JSON.parse(e.data);}catch(_){return;}
  if(r.type!=='tl') return;
  data.push({t:r.t, cpu:r.cpu, gpu:r.gpu});
  while(data.length>MAXP) data.shift();
  document.getElementById('gpuval').innerHTML = r.gpu.toFixed(0)+'<small>%</small>';
  document.getElementById('cpuval').innerHTML = r.cpu.toFixed(0)+'<small>%</small>';
  document.getElementById('srclab').textContent = r.src ? ('source: '+r.src) : '';
  document.getElementById('foot').textContent =
     'streaming • t = '+r.t.toFixed(1)+'s • '+data.length+' points in view';
  dirty = true;
};

resize(); loop();
</script>
</body>
</html>
